# DukaLink for a shared home server: no proxy of its own and nothing but port 3007 is published.
# Point your existing front door (Caddy / tunnel / router) at  <server>:3007  for the three hostnames.
name: dukalink
services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  backend:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 60"
    volumes: [static:/app/staticfiles]
    depends_on:
      db: { condition: service_healthy }

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports: ["3007:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/srv/static:ro
      - ./www:/srv/www:ro
    depends_on: [backend]

volumes:
  pgdata:
  static:
